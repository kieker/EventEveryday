services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:8025:8025"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eventeveryday}
      POSTGRES_USER: ${POSTGRES_USER:-eventeveryday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventeveryday_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: development
    command: >-
      sh -c "python manage.py migrate &&
      python manage.py seed_dev_admin &&
      python manage.py seed_demo_events &&
      python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://eventeveryday:eventeveryday_dev@db:5432/eventeveryday}
      RATE_LIMIT_REDIS_URL: ${RATE_LIMIT_REDIS_URL:-redis://redis:6379/0}
      RATE_LIMIT_TRUSTED_PROXIES: ${RATE_LIMIT_TRUSTED_PROXIES:-}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-development-only-change-before-deployment}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CORS_ALLOWED_ORIGINS: ${DJANGO_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      PAYFAST_SANDBOX: ${PAYFAST_SANDBOX:-true}
      PAYFAST_MERCHANT_ID: ${PAYFAST_MERCHANT_ID:-}
      PAYFAST_MERCHANT_KEY: ${PAYFAST_MERCHANT_KEY:-}
      PAYFAST_PASSPHRASE: ${PAYFAST_PASSPHRASE:-}
      PAYFAST_PROCESS_URL: ${PAYFAST_PROCESS_URL:-https://sandbox.payfast.co.za/eng/process}
      PAYFAST_VALIDATE_URL: ${PAYFAST_VALIDATE_URL:-https://sandbox.payfast.co.za/eng/query/validate}
      PAYFAST_NOTIFY_URL: ${PAYFAST_NOTIFY_URL:-http://localhost:8000/api/payments/payfast/notify/}
      PAYFAST_TRUST_X_FORWARDED_FOR: ${PAYFAST_TRUST_X_FORWARDED_FOR:-false}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      EMAIL_HOST: ${EMAIL_HOST:-mailpit}
      EMAIL_PORT: ${EMAIL_PORT:-1025}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-EventEveryday <bookings@eventeveryday.local>}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    volumes:
      - ./backend:/app
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      target: development
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:8000/api}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "${HOST_BIND_IP:-0.0.0.0}:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
  frontend_next:
