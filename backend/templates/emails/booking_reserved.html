<!doctype html><html lang="en"><body style="margin:0;background:#f4f0e7;color:#17221b;font-family:Arial,sans-serif"><div style="max-width:600px;margin:auto;padding:40px 24px"><p style="color:#d45b2c;font-weight:700;text-transform:uppercase">Reservation created</p><h1 style="font-family:Georgia,serif;font-size:36px;font-weight:500">{{ booking.event.title }}</h1><p style="line-height:1.6">We are holding {{ booking.quantity }} ticket{{ booking.quantity|pluralize }} until {{ booking.expires_at|date:"j F Y, H:i T" }} while payment is pending.</p><p><strong>Reference:</strong> {{ booking.reference }}<br><strong>Total:</strong> R{{ booking.total }}</p><p style="margin-top:32px"><a href="{{ booking_url }}" style="background:#17221b;color:#fff;padding:14px 18px;text-decoration:none;font-weight:700">View reservation</a></p></div></body></html>
