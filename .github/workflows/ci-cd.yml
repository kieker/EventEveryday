name: CI / CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eventeveryday_test
          POSTGRES_USER: eventeveryday
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eventeveryday -d eventeveryday_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://eventeveryday:test_password@localhost:5432/eventeveryday_test
      RATE_LIMIT_REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-only-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: python manage.py check --deploy
        working-directory: backend
        env:
          DJANGO_DEBUG: "false"
          DJANGO_BEHIND_HTTPS_PROXY: "true"
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CORS_ALLOWED_ORIGINS: https://example.com
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python manage.py test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://example.com/api
          INTERNAL_API_URL: http://localhost:8000/api
      - run: npm run typecheck
        working-directory: frontend

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Verify deployment configuration
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          : "${VPS_HOST:?Set the VPS_HOST repository variable}"
          : "${VPS_USER:?Set the VPS_USER repository variable}"
          : "${VPS_DEPLOY_PATH:?Set the VPS_DEPLOY_PATH repository variable}"
          : "${VPS_SSH_KEY:?Set the VPS_SSH_KEY production environment secret}"
          : "${VPS_KNOWN_HOSTS:?Set the VPS_KNOWN_HOSTS production environment secret}"
      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Sync application
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH }}
        run: |
          test -n "$VPS_HOST" && test -n "$VPS_USER" && test -n "$VPS_DEPLOY_PATH"
          rsync -az --exclude='.git' --exclude='.env' --exclude='media/' --exclude='node_modules/' --exclude='.next/' ./ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"
          ssh "$VPS_USER@$VPS_HOST" "cd '$VPS_DEPLOY_PATH' && bash scripts/deploy-vps.sh"
